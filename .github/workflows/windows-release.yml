name: Windows release validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CLAUDE_CODE_VERSION: "2.1.84"
  CLAUDE_NPM_NODE_VERSION: "20.18.3"
  NODE_VERSION: "24.19.0"
  PNPM_VERSION: "11.19.0"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  windows-tests:
    name: Tests / ${{ matrix.os }} / Windows PowerShell 5.1
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2022
          - windows-latest

    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Prove the target PowerShell and architecture
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if ($PSVersionTable.PSEdition -ne "Desktop") {
              throw "Windows PowerShell Desktop is required; found $($PSVersionTable.PSEdition)"
          }
          if ($PSVersionTable.PSVersion -lt [version]"5.1") {
              throw "Windows PowerShell 5.1+ is required; found $($PSVersionTable.PSVersion)"
          }
          if (-not [Environment]::Is64BitOperatingSystem -or
              $env:PROCESSOR_ARCHITECTURE -ne "AMD64") {
              throw "Windows x64/AMD64 is required; found $env:PROCESSOR_ARCHITECTURE"
          }
          Write-Host "Windows PowerShell $($PSVersionTable.PSVersion) Desktop / AMD64"
          python --version

      - name: Run the complete Python regression suite
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          python -m unittest discover -s tests -v

      - name: Parse every PowerShell script with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $Failures = @()
          Get-ChildItem -LiteralPath . -Filter "*.ps1" -Recurse | ForEach-Object {
              $Tokens = $null
              $ParseErrors = $null
              [Management.Automation.Language.Parser]::ParseFile(
                  $_.FullName,
                  [ref]$Tokens,
                  [ref]$ParseErrors
              ) | Out-Null
              foreach ($ParseError in @($ParseErrors)) {
                  $Failures += "$($_.FullName): $($ParseError.Message)"
              }
          }
          if ($Failures.Count -ne 0) {
              throw ($Failures -join [Environment]::NewLine)
          }
          Write-Host "All PowerShell scripts parsed successfully."

      - name: Run the transactional Claude MCP registrar self-test
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          python .\scripts\register_claude_user_mcp.py self-test

      - name: Prove tests did not mutate the checkout
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $Status = git status --porcelain=v1
          if ($LASTEXITCODE -ne 0) {
              throw "git status failed with exit code $LASTEXITCODE"
          }
          if ($Status) {
              Write-Host $Status
              throw "Windows tests mutated the reviewed checkout."
          }

  windows-package-and-install:
    name: Package, existing-Claude gates, and one-click install
    needs: windows-tests
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up the approved build Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.19.0"

      - name: Install the pinned build-only pnpm
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          npm.cmd install --global "pnpm@$env:PNPM_VERSION"
          if ($LASTEXITCODE -ne 0) {
              throw "npm could not install build-only pnpm $env:PNPM_VERSION"
          }
          $ActualPnpm = (& pnpm.cmd --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $ActualPnpm -ne $env:PNPM_VERSION) {
              throw "Expected pnpm $env:PNPM_VERSION; found $ActualPnpm"
          }
          $ActualNode = (& node.exe --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $ActualNode -ne "v$env:NODE_VERSION") {
              throw "Expected Node.js v$env:NODE_VERSION; found $ActualNode"
          }
          Write-Host "Online build tools: Node.js $ActualNode / pnpm $ActualPnpm"

      - name: Prepare the approved minimal Windows Node distribution
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $SourceRoot = Join-Path $env:RUNNER_TEMP "node-source"
          $DistributionRoot = Join-Path $env:RUNNER_TEMP "node-minimal"
          New-Item -ItemType Directory -Path $SourceRoot -Force | Out-Null
          $ArchiveName = "node-v$env:NODE_VERSION-win-x64.zip"
          $Archive = Join-Path $SourceRoot $ArchiveName
          $Checksums = Join-Path $SourceRoot "SHASUMS256.txt"
          $ReleaseRoot = "https://nodejs.org/download/release/v$env:NODE_VERSION"
          Invoke-WebRequest -UseBasicParsing -Uri "$ReleaseRoot/$ArchiveName" -OutFile $Archive
          Invoke-WebRequest -UseBasicParsing -Uri "$ReleaseRoot/SHASUMS256.txt" -OutFile $Checksums
          python .\scripts\prepare_windows_node_distribution.py `
              --archive $Archive `
              --shasums $Checksums `
              --output $DistributionRoot `
              --approval-file .\config\windows-node-sources.json
          if ($LASTEXITCODE -ne 0) {
              throw "Minimal Windows Node distribution preparation failed."
          }
          "WINDOWS_NODE_DISTRIBUTION=$DistributionRoot" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download and verify the approved Playwright Extension CRX
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $Approval = Get-Content -LiteralPath `
              .\config\playwright-extension-source.json -Raw | ConvertFrom-Json
          $ExtensionCrx = Join-Path $env:RUNNER_TEMP $Approval.filename
          Invoke-WebRequest -UseBasicParsing `
              -Uri $Approval.downloadUrl `
              -OutFile $ExtensionCrx
          python .\scripts\validate_playwright_extension.py `
              $ExtensionCrx `
              --approval-file .\config\playwright-extension-source.json
          if ($LASTEXITCODE -ne 0) {
              throw "Approved Playwright Extension validation failed."
          }
          "PLAYWRIGHT_EXTENSION_CRX=$ExtensionCrx" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build the runtime natively with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $Node = (Get-Command node.exe -ErrorAction Stop).Source
          $Pnpm = (Get-Command pnpm.cmd -ErrorAction Stop).Source
          $Python = (Get-Command python.exe -ErrorAction Stop).Source
          & powershell.exe -NoLogo -NoProfile -File .\scripts\build-offline-bundle.ps1 `
              -Profile core `
              -NodeDistribution $env:WINDOWS_NODE_DISTRIBUTION `
              -NodeBin $Node `
              -PnpmBin $Pnpm `
              -PythonBin $Python `
              -OutputDir .\dist
          if ($LASTEXITCODE -ne 0) {
              throw "Native Windows runtime build failed with exit code $LASTEXITCODE"
          }
          $RuntimeArchives = @(Get-ChildItem -LiteralPath .\dist `
              -Filter "browser-agent-runtime-1.0.13-core-windows-x64.tar.gz")
          if ($RuntimeArchives.Count -ne 1) {
              throw "Expected exactly one Windows runtime archive; found $($RuntimeArchives.Count)"
          }
          "RUNTIME_ARCHIVE=$($RuntimeArchives[0].FullName)" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Assemble and extract the reviewed transfer kit
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          python .\scripts\build-transfer-kit.py `
              --runtime-archive $env:RUNTIME_ARCHIVE `
              --extension-crx $env:PLAYWRIGHT_EXTENSION_CRX `
              --output-dir .\dist
          if ($LASTEXITCODE -ne 0) {
              throw "Transfer-kit build failed."
          }
          $TransferArchives = @(Get-ChildItem -LiteralPath .\dist `
              -Filter "intranet-browser-agent-transfer-1.0.13-core-windows-x64.tar.gz")
          if ($TransferArchives.Count -ne 1) {
              throw "Expected exactly one Windows transfer archive; found $($TransferArchives.Count)"
          }
          python .\scripts\verify-bundle.py $TransferArchives[0].FullName
          if ($LASTEXITCODE -ne 0) {
              throw "Transfer archive verification failed."
          }
          $ExtractionRoot = Join-Path $env:RUNNER_TEMP "windows-transfer"
          New-Item -ItemType Directory -Path $ExtractionRoot -Force | Out-Null
          & tar.exe -xzf $TransferArchives[0].FullName -C $ExtractionRoot
          if ($LASTEXITCODE -ne 0) {
              throw "Windows tar.exe could not extract the transfer kit."
          }
          $TransferRoots = @(Get-ChildItem -LiteralPath $ExtractionRoot -Directory)
          if ($TransferRoots.Count -ne 1) {
              throw "Expected one extracted transfer root; found $($TransferRoots.Count)"
          }
          python .\scripts\verify-bundle.py $TransferRoots[0].FullName
          if ($LASTEXITCODE -ne 0) {
              throw "Extracted transfer verification failed."
          }
          "TRANSFER_ARCHIVE=$($TransferArchives[0].FullName)" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TRANSFER_ROOT=$($TransferRoots[0].FullName)" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up the target-like existing npm Claude Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.CLAUDE_NPM_NODE_VERSION }}

      - name: Prepare exact native and npm Claude Code CI fixtures
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          # These installations exist only on the disposable online runner.
          # The transfer kit never installs or repairs Claude Code on a target.
          & powershell.exe -NoLogo -NoProfile -Command `
              "& ([scriptblock]::Create((Invoke-RestMethod https://claude.ai/install.ps1))) $env:CLAUDE_CODE_VERSION"
          if ($LASTEXITCODE -ne 0) {
              throw "The CI-only native Claude fixture failed to install with exit code $LASTEXITCODE"
          }
          $Candidates = @(
              (Join-Path $env:USERPROFILE ".local\bin\claude.exe")
          )
          $ClaudeCommand = Get-Command claude.exe -ErrorAction SilentlyContinue
          if ($ClaudeCommand) {
              $Candidates += $ClaudeCommand.Source
          }
          $ClaudeExecutable = $Candidates |
              Where-Object { $_ -and (Test-Path -LiteralPath $_ -PathType Leaf) } |
              Select-Object -First 1
          if (-not $ClaudeExecutable -or
              [IO.Path]::GetExtension($ClaudeExecutable) -ine ".exe") {
              throw "The CI-only native fixture did not produce claude.exe."
          }
          $ActualNativeClaude = ((& $ClaudeExecutable --version 2>&1) -join "`n").Trim()
          if ($LASTEXITCODE -ne 0 -or
              $ActualNativeClaude -notmatch ("^" + [regex]::Escape($env:CLAUDE_CODE_VERSION) + "(?:\s|$)")) {
              throw "Expected native Claude Code $env:CLAUDE_CODE_VERSION; found $ActualNativeClaude"
          }

          $NpmClaudeRoot = Join-Path $env:RUNNER_TEMP "existing-npm-claude"
          npm.cmd install --global --prefix $NpmClaudeRoot --ignore-scripts `
              "@anthropic-ai/claude-code@$env:CLAUDE_CODE_VERSION"
          if ($LASTEXITCODE -ne 0) {
              throw "The CI-only npm Claude fixture failed to install with exit code $LASTEXITCODE"
          }
          $NpmClaudeCommand = Join-Path $NpmClaudeRoot "claude.cmd"
          if (-not (Test-Path -LiteralPath $NpmClaudeCommand -PathType Leaf)) {
              throw "The CI-only npm fixture did not produce claude.cmd."
          }
          $ActualNpmClaude = ((& $NpmClaudeCommand --version 2>&1) -join "`n").Trim()
          if ($LASTEXITCODE -ne 0 -or
              $ActualNpmClaude -notmatch ("^" + [regex]::Escape($env:CLAUDE_CODE_VERSION) + "(?:\s|$)")) {
              throw "Expected npm Claude Code $env:CLAUDE_CODE_VERSION; found $ActualNpmClaude"
          }
          # Windows PowerShell can return every matching application here.
          # setup-node prepends the requested target-like Node, so select that
          # first PATH entry explicitly and verify its version below.
          $NpmClaudeNode = (Get-Command node.exe -CommandType Application `
              -ErrorAction Stop | Select-Object -First 1).Source
          $ActualNpmNode = ((& $NpmClaudeNode --version 2>&1) -join "`n").Trim()
          if ($LASTEXITCODE -ne 0 -or
              $ActualNpmNode -ne "v$env:CLAUDE_NPM_NODE_VERSION") {
              throw "Expected target-like npm Claude Node.js v$env:CLAUDE_NPM_NODE_VERSION; found $ActualNpmNode"
          }

          "NATIVE_CLAUDE_EXECUTABLE=$ClaudeExecutable" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NPM_CLAUDE_ROOT=$NpmClaudeRoot" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NPM_CLAUDE_COMMAND=$NpmClaudeCommand" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NPM_CLAUDE_NODE=$NpmClaudeNode" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DISABLE_AUTOUPDATER=1" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DISABLE_UPDATES=1" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $ClaudeConfig = Join-Path $env:RUNNER_TEMP "pilot-claude-config"
          New-Item -ItemType Directory -Path $ClaudeConfig -Force | Out-Null
          "CLAUDE_CONFIG_DIR=$ClaudeConfig" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "CI-only native Claude Code: $ActualNativeClaude"
          Write-Host "CI-only npm Claude Code: $ActualNpmClaude"
          Write-Host "CI-only npm Claude Node.js: $ActualNpmNode"

      - name: Prove native Claude compatibility in an isolated release gate
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $Gate = Join-Path $env:TRANSFER_ROOT `
              "toolkit\scripts\verify-windows-release.ps1"
          $PublisherGateLog = Join-Path $env:RUNNER_TEMP `
              "WINDOWS-PUBLISHER-RELEASE-GATE.log"
          & powershell.exe -NoLogo -NoProfile -File $Gate `
              -ClaudeExecutable $env:NATIVE_CLAUDE_EXECUTABLE `
              -TransferPath $env:TRANSFER_ROOT `
              -LogPath $PublisherGateLog
          if ($LASTEXITCODE -ne 0) {
              throw "The isolated native Claude release gate failed with exit code $LASTEXITCODE"
          }
          "PUBLISHER_GATE_LOG=$PublisherGateLog" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run the exact one-click package launcher
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $ExpectedClaudeFallback = Join-Path $env:USERPROFILE `
              ".local\bin\claude.exe"
          if (-not (Test-Path -LiteralPath $ExpectedClaudeFallback -PathType Leaf)) {
              throw "The official per-user Claude Code fallback path is missing."
          }
          if (-not [string]::Equals(
              [IO.Path]::GetFullPath($env:NATIVE_CLAUDE_EXECUTABLE),
              [IO.Path]::GetFullPath($ExpectedClaudeFallback),
              [StringComparison]::OrdinalIgnoreCase
          )) {
              throw "The native compatibility fixture is not the official per-user path."
          }
          $ClaudeDirectory = [IO.Path]::GetFullPath(
              (Split-Path -Parent $ExpectedClaudeFallback)
          ).TrimEnd("\")
          $env:PATH = (@($env:PATH -split ";" | Where-Object {
              if (-not $_) {
                  return $false
              }
              try {
                  $PathDirectory = [IO.Path]::GetFullPath($_).TrimEnd("\")
                  return -not [string]::Equals(
                      $PathDirectory,
                      $ClaudeDirectory,
                      [StringComparison]::OrdinalIgnoreCase
                  )
              } catch {
                  return $true
              }
          }) -join ";")
          if (Get-Command claude.exe -ErrorAction SilentlyContinue) {
              throw "CI failed to hide native claude.exe from PATH."
          }
          if (-not (Test-Path -LiteralPath $env:NPM_CLAUDE_COMMAND -PathType Leaf)) {
              throw "The existing npm Claude command fixture is missing."
          }
          $env:PATH = $env:NPM_CLAUDE_ROOT + ";" + $env:PATH
          $NpmCommand = Get-Command claude.cmd -CommandType Application `
              -ErrorAction Stop
          if (-not [string]::Equals(
              [IO.Path]::GetFullPath($NpmCommand.Source),
              [IO.Path]::GetFullPath($env:NPM_CLAUDE_COMMAND),
              [StringComparison]::OrdinalIgnoreCase
          )) {
              throw "PATH did not resolve the expected existing npm claude.cmd."
          }
          $Discovery = Join-Path $env:TRANSFER_ROOT `
              "toolkit\scripts\windows-tool-discovery.ps1"
          . $Discovery
          $ClaudeInvocation = Resolve-ClaudeCodeInvocation
          if ($ClaudeInvocation.Kind -ne "npm" -or
              -not [string]::Equals(
                  [IO.Path]::GetFullPath([string]$ClaudeInvocation.CommandPath),
                  [IO.Path]::GetFullPath($env:NPM_CLAUDE_COMMAND),
                  [StringComparison]::OrdinalIgnoreCase
              )) {
              throw "The shared resolver did not select the existing npm Claude command."
          }
          $ResolvedClaudeArguments = @($ClaudeInvocation.Prefix) + @("--version")
          $ResolvedClaudeVersion = ((& $ClaudeInvocation.Executable `
              @ResolvedClaudeArguments 2>&1) -join "`n").Trim()
          if ($LASTEXITCODE -ne 0 -or
              $ResolvedClaudeVersion -notmatch ("^" + `
                  [regex]::Escape($env:CLAUDE_CODE_VERSION) + "(?:\s|$)")) {
              throw "The resolved npm Claude invocation is unusable: $ResolvedClaudeVersion"
          }
          Write-Host "CI EXISTING NPM CLAUDE READY: $($ClaudeInvocation.CommandPath)"
          $Launcher = Join-Path $env:TRANSFER_ROOT "INSTALL-WINDOWS-PILOT.cmd"
          if (-not (Test-Path -LiteralPath $Launcher -PathType Leaf)) {
              throw "Transfer launcher is missing: $Launcher"
          }
          $PilotLocalAppData = Join-Path $env:RUNNER_TEMP "pilot-local-app-data"
          New-Item -ItemType Directory -Path $PilotLocalAppData -Force | Out-Null
          $env:LOCALAPPDATA = $PilotLocalAppData
          "LOCALAPPDATA=$PilotLocalAppData" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $ChromeCandidates = @(
              (Join-Path $env:ProgramFiles "Google\Chrome\Application\chrome.exe"),
              (Join-Path ${env:ProgramFiles(x86)} "Google\Chrome\Application\chrome.exe"),
              (Join-Path $env:LOCALAPPDATA "Google\Chrome\Application\chrome.exe")
          )
          $ChromeExe = $ChromeCandidates |
              Where-Object { $_ -and (Test-Path -LiteralPath $_ -PathType Leaf) } |
              Select-Object -First 1
          if (-not $ChromeExe) {
              throw "Chrome is required for the offline extension installation test."
          }
          "CHROME_EXE=$ChromeExe" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $CdpProbe = Join-Path $env:GITHUB_WORKSPACE `
              ".github\scripts\load-unpacked-extension-cdp.js"
          $ExtensionExercise = Join-Path $env:GITHUB_WORKSPACE `
              ".github\scripts\exercise-extension-mcp.py"
          $ExtensionTokenFile = Join-Path $env:RUNNER_TEMP `
              "playwright-extension-ci-token.txt"
          $CdpReadyFile = Join-Path $env:RUNNER_TEMP `
              "playwright-extension-ci-ready.json"
          $CdpStopFile = Join-Path $env:RUNNER_TEMP `
              "playwright-extension-ci-stop.txt"
          $CdpStdout = Join-Path $env:RUNNER_TEMP `
              "playwright-extension-ci.stdout.log"
          $CdpStderr = Join-Path $env:RUNNER_TEMP `
              "playwright-extension-ci.stderr.log"
          $LauncherExitFile = Join-Path $env:RUNNER_TEMP `
              "one-click-launcher.exit.txt"
          $CdpExitFile = Join-Path $env:RUNNER_TEMP `
              "playwright-extension-ci.exit.txt"
          $RuntimeLockMarker = Join-Path $env:RUNNER_TEMP `
              "runtime-publish-access-denied.txt"
          $RuntimeLockStdout = Join-Path $env:RUNNER_TEMP `
              "runtime-publish-access-denied.stdout.log"
          $RuntimeLockStderr = Join-Path $env:RUNNER_TEMP `
              "runtime-publish-access-denied.stderr.log"
          $RuntimeLockExitFile = Join-Path $env:RUNNER_TEMP `
              "runtime-publish-access-denied.exit.txt"
          $RuntimeLockScript = Join-Path $env:GITHUB_WORKSPACE `
              ".github\scripts\inject-runtime-publish-access-denied.ps1"
          $RuntimeLockStagingRoot = Join-Path $PilotLocalAppData `
              "IntranetBrowserAgent\staging"
          $InstallLogRoot = Join-Path $env:TEMP "IntranetBrowserAgent"
          $CiExtensionPolicySubKey = `
              "Software\Policies\Google\Chrome\ExtensionInstallForcelist"
          $CiExtensionPolicyPath = "HKCU:\$CiExtensionPolicySubKey"
          $script:CiExtensionPolicyKeyWasPresent = $false
          $script:CiExtensionPolicyCreatedPaths = @()
          $script:CiExtensionPolicyOriginalAccessSddl = ""
          $script:CiExtensionPolicyAclArmed = $false
          $script:CiExtensionPolicyAclRestored = $false
          $Approval = Get-Content -LiteralPath (Join-Path `
              $env:TRANSFER_ROOT `
              "toolkit\config\playwright-extension-source.json") `
              -Raw | ConvertFrom-Json
          $InstalledUnpacked = Join-Path $env:LOCALAPPDATA `
              "IntranetBrowserAgent\browser-extension\$($Approval.version)\unpacked"
          $PreparedExtensionRoot = Split-Path -Parent $InstalledUnpacked
          $InvalidExtensionMarkerName = "ci-invalid-extension-leftover.txt"
          New-Item -ItemType Directory -Path $PreparedExtensionRoot `
              -Force | Out-Null
          [IO.File]::WriteAllText(
              (Join-Path $PreparedExtensionRoot $InvalidExtensionMarkerName),
              "preserve-and-rebuild",
              (New-Object System.Text.UTF8Encoding($false))
          )
          $ChromeUserData = Join-Path $env:LOCALAPPDATA `
              "Google\Chrome\User Data"
          & node.exe --check $CdpProbe
          if ($LASTEXITCODE -ne 0) {
              throw "The Chrome extension CDP probe has invalid JavaScript syntax."
          }
          $Wrapper = Join-Path $env:RUNNER_TEMP "run-one-click-pilot.cmd"
          $WrapperBody = @"
          @echo off
          call "$Launcher" -ManualExtensionWaitSeconds 180 < nul
          set "PILOT_EXIT=%errorlevel%"
          > "$LauncherExitFile" echo %PILOT_EXIT%
          exit /b %PILOT_EXIT%
          "@
          [IO.File]::WriteAllText(
              $Wrapper,
              $WrapperBody,
              (New-Object System.Text.ASCIIEncoding)
          )
          $CdpWrapper = Join-Path $env:RUNNER_TEMP `
              "run-playwright-extension-ci-session.cmd"
          $CdpWrapperBody = @"
          @echo off
          node.exe "$CdpProbe" --chrome "$ChromeExe" --profile "$ChromeUserData" --extension "$InstalledUnpacked" --expected-id "$($Approval.extensionId)" --expected-version "$($Approval.version)" --token-file "$ExtensionTokenFile" --ready-file "$CdpReadyFile" --stop-file "$CdpStopFile" --maximum-seconds 600
          set "CDP_EXIT=%errorlevel%"
          > "$CdpExitFile" echo %CDP_EXIT%
          exit /b %CDP_EXIT%
          "@
          [IO.File]::WriteAllText(
              $CdpWrapper,
              $CdpWrapperBody,
              (New-Object System.Text.ASCIIEncoding)
          )
          $RuntimeLockWrapper = Join-Path $env:RUNNER_TEMP `
              "run-runtime-publish-access-denied.cmd"
          $RuntimeLockWrapperBody = @"
          @echo off
          powershell.exe -NoLogo -NoProfile -NonInteractive -File "$RuntimeLockScript" -StagingRoot "$RuntimeLockStagingRoot" -MarkerPath "$RuntimeLockMarker" -InstallLogRoot "$InstallLogRoot"
          set "RUNTIME_LOCK_EXIT=%errorlevel%"
          > "$RuntimeLockExitFile" echo %RUNTIME_LOCK_EXIT%
          exit /b %RUNTIME_LOCK_EXIT%
          "@
          [IO.File]::WriteAllText(
              $RuntimeLockWrapper,
              $RuntimeLockWrapperBody,
              (New-Object System.Text.ASCIIEncoding)
          )
          $LauncherStdout = Join-Path $env:RUNNER_TEMP "one-click-launcher.stdout.log"
          $LauncherStderr = Join-Path $env:RUNNER_TEMP "one-click-launcher.stderr.log"
          $FirewallRule = "IntranetBrowserAgent-Chrome-CI-$env:GITHUB_RUN_ID"
          $ClaudeFirewallRule = `
              "IntranetBrowserAgent-Claude-CI-$env:GITHUB_RUN_ID"
          $LauncherProcess = $null
          $CdpProcess = $null
          $RuntimeLockProcess = $null
          $LauncherFinished = $false
          $CdpFinished = $false
          $RuntimeLockFinished = $false
          function Stop-CiChrome {
              @(Get-Process -Name chrome -ErrorAction SilentlyContinue) |
                  Stop-Process -Force -ErrorAction SilentlyContinue
              $ChromeShutdownDeadline = [DateTime]::UtcNow.AddSeconds(30)
              do {
                  $RemainingChrome = @(
                      Get-Process -Name chrome -ErrorAction SilentlyContinue
                  )
                  if ($RemainingChrome.Count -eq 0) {
                      return
                  }
                  Start-Sleep -Milliseconds 250
              } while ([DateTime]::UtcNow -lt $ChromeShutdownDeadline)
              throw "CI could not release the disposable Chrome Profile."
          }
          function Read-CiExitCode {
              param(
                  [Parameter(Mandatory = $true)][string]$Path,
                  [Parameter(Mandatory = $true)][string]$Label
              )
              if (-not (Test-Path -LiteralPath $Path -PathType Leaf)) {
                  throw "$Label did not write its exit-code marker: $Path"
              }
              $RawExitCode = (Get-Content -LiteralPath $Path -Raw).Trim()
              $ParsedExitCode = 0
              if (-not [int]::TryParse($RawExitCode, [ref]$ParsedExitCode)) {
                  throw "$Label wrote an invalid exit code: $RawExitCode"
              }
              return $ParsedExitCode
          }
          function Restore-CiExtensionPolicyAccess {
              if ($script:CiExtensionPolicyAclRestored) {
                  return
              }
              if ($script:CiExtensionPolicyAclArmed) {
                  $RestorePolicyKey =
                      [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey(
                          $CiExtensionPolicySubKey,
                          [Microsoft.Win32.RegistryKeyPermissionCheck]::ReadWriteSubTree,
                          ([Security.AccessControl.RegistryRights]::ReadPermissions `
                              -bor [Security.AccessControl.RegistryRights]::ChangePermissions)
                      )
                  if ($null -eq $RestorePolicyKey) {
                      throw "CI could not reopen the extension-policy key to restore its ACL."
                  }
                  $RestorePolicySecurity = $RestorePolicyKey.GetAccessControl(
                      [Security.AccessControl.AccessControlSections]::Access
                  )
                  $RestorePolicySecurity.SetSecurityDescriptorSddlForm(
                      $script:CiExtensionPolicyOriginalAccessSddl,
                      [Security.AccessControl.AccessControlSections]::Access
                  )
                  $RestorePolicyKey.SetAccessControl($RestorePolicySecurity)
                  $RestorePolicyKey.Dispose()
                  $VerifyRestoredPolicyKey =
                      [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey(
                          $CiExtensionPolicySubKey,
                          [Microsoft.Win32.RegistryKeyPermissionCheck]::ReadSubTree,
                          [Security.AccessControl.RegistryRights]::ReadPermissions
                      )
                  if ($null -eq $VerifyRestoredPolicyKey) {
                      throw "CI could not reopen the restored extension-policy key."
                  }
                  $RestoredPolicyAccessSddl =
                      $VerifyRestoredPolicyKey.GetAccessControl(
                          [Security.AccessControl.AccessControlSections]::Access
                      ).GetSecurityDescriptorSddlForm(
                          [Security.AccessControl.AccessControlSections]::Access
                      )
                  $VerifyRestoredPolicyKey.Dispose()
                  if ($RestoredPolicyAccessSddl -cne `
                      $script:CiExtensionPolicyOriginalAccessSddl) {
                      throw "CI did not restore the exact extension-policy access ACL."
                  }
              }
              for ($CiCreatedPolicyIndex =
                      $script:CiExtensionPolicyCreatedPaths.Count - 1;
                  $CiCreatedPolicyIndex -ge 0;
                  $CiCreatedPolicyIndex -= 1) {
                  $CiCreatedPolicyPath =
                      $script:CiExtensionPolicyCreatedPaths[$CiCreatedPolicyIndex]
                  $CiCreatedPolicyKey =
                      [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey(
                          $CiCreatedPolicyPath,
                          $false
                      )
                  if ($null -eq $CiCreatedPolicyKey) {
                      continue
                  }
                  $CiCreatedPolicyKeyIsEmpty =
                      @($CiCreatedPolicyKey.GetValueNames()).Count -eq 0 -and
                      $CiCreatedPolicyKey.SubKeyCount -eq 0
                  $CiCreatedPolicyKey.Dispose()
                  if ($CiCreatedPolicyKeyIsEmpty) {
                      [Microsoft.Win32.Registry]::CurrentUser.DeleteSubKey(
                          $CiCreatedPolicyPath,
                          $false
                      )
                  }
              }
              $script:CiExtensionPolicyAclRestored = $true
              Write-Host "CI EXTENSION POLICY ACCESS DENIED RESTORED"
          }
          try {
              $CiExistingPolicyKey =
                  [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey(
                      $CiExtensionPolicySubKey,
                      $false
                  )
              $script:CiExtensionPolicyKeyWasPresent =
                  $null -ne $CiExistingPolicyKey
              if ($null -ne $CiExistingPolicyKey) {
                  $CiExistingPolicyKey.Dispose()
              }
              if (-not $script:CiExtensionPolicyKeyWasPresent) {
                  $CiCurrentPolicyPath = ""
                  foreach ($CiPolicyPathPart in @(
                      $CiExtensionPolicySubKey -split '\\')) {
                      if (-not $CiPolicyPathPart) {
                          continue
                      }
                      $CiCurrentPolicyPath = if ($CiCurrentPolicyPath) {
                          "$CiCurrentPolicyPath\$CiPolicyPathPart"
                      } else {
                          $CiPolicyPathPart
                      }
                      $CiCurrentPolicyKey =
                          [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey(
                              $CiCurrentPolicyPath,
                              $false
                          )
                      if ($null -eq $CiCurrentPolicyKey) {
                          $CiCurrentPolicyKey =
                              [Microsoft.Win32.Registry]::CurrentUser.CreateSubKey(
                                  $CiCurrentPolicyPath,
                                  [Microsoft.Win32.RegistryKeyPermissionCheck]::ReadWriteSubTree
                              )
                          if ($null -eq $CiCurrentPolicyKey) {
                              throw (
                                  "CI could not create extension policy segment: " +
                                  $CiCurrentPolicyPath
                              )
                          }
                          $script:CiExtensionPolicyCreatedPaths += `
                              $CiCurrentPolicyPath
                      }
                      $CiCurrentPolicyKey.Dispose()
                  }
                  if ($CiCurrentPolicyPath -cne $CiExtensionPolicySubKey) {
                      throw "CI extension policy path creation returned the wrong key."
                  }
              }
              $CiPolicyKey =
                  [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey(
                      $CiExtensionPolicySubKey,
                      [Microsoft.Win32.RegistryKeyPermissionCheck]::ReadWriteSubTree,
                      ([Security.AccessControl.RegistryRights]::ReadPermissions `
                          -bor [Security.AccessControl.RegistryRights]::ChangePermissions)
                  )
              if ($null -eq $CiPolicyKey) {
                  throw "CI could not open the extension policy test key for ACL changes."
              }
              $CiPolicyAcl = $CiPolicyKey.GetAccessControl(
                  [Security.AccessControl.AccessControlSections]::Access
              )
              $script:CiExtensionPolicyOriginalAccessSddl = `
                  $CiPolicyAcl.GetSecurityDescriptorSddlForm(
                      [Security.AccessControl.AccessControlSections]::Access
                  )
              $CiPolicyIdentity = `
                  [Security.Principal.WindowsIdentity]::GetCurrent().User
              $CiPolicyDeny = `
                  [Security.AccessControl.RegistryAccessRule]::new(
                      $CiPolicyIdentity,
                      [Security.AccessControl.RegistryRights]::SetValue,
                      [Security.AccessControl.InheritanceFlags]::None,
                      [Security.AccessControl.PropagationFlags]::None,
                      [Security.AccessControl.AccessControlType]::Deny
                  )
              $null = $CiPolicyAcl.AddAccessRule($CiPolicyDeny)
              $CiPolicyKey.SetAccessControl($CiPolicyAcl)
              $script:CiExtensionPolicyAclArmed = $true
              $CiPolicyKey.Dispose()
              $CiPolicyProbeName = "ci-access-denied-probe"
              $CiPolicyWriteDenied = $false
              $CiPolicyProbeKey = $null
              try {
                  $CiPolicyProbeKey =
                      [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey(
                          $CiExtensionPolicySubKey,
                          $true
                      )
                  if ($null -eq $CiPolicyProbeKey) {
                      throw [UnauthorizedAccessException]::new(
                          "The extension policy key was not writable."
                      )
                  }
                  $CiPolicyProbeKey.SetValue(
                      $CiPolicyProbeName,
                      "must-not-write",
                      [Microsoft.Win32.RegistryValueKind]::String
                  )
              } catch {
                  $CiPolicyProbeError = $_.Exception
                  $CiPolicyProbePermissionDenied = $false
                  while ($null -ne $CiPolicyProbeError) {
                      if ($CiPolicyProbeError -is `
                              [System.UnauthorizedAccessException] -or
                          $CiPolicyProbeError -is `
                              [System.Security.SecurityException]) {
                          $CiPolicyProbePermissionDenied = $true
                          break
                      }
                      $CiPolicyProbeError = $CiPolicyProbeError.InnerException
                  }
                  if (-not $CiPolicyProbePermissionDenied -and
                      $_.CategoryInfo.Category -ne `
                          [Management.Automation.ErrorCategory]::PermissionDenied) {
                      throw
                  }
                  $CiPolicyWriteDenied = $true
              } finally {
                  if ($null -ne $CiPolicyProbeKey) {
                      $CiPolicyProbeKey.Dispose()
                  }
              }
              if (-not $CiPolicyWriteDenied) {
                  throw "CI could not deny the exact extension policy SetValue operation."
              }
              Write-Host "CI EXTENSION POLICY ACCESS DENIED ARMED"
              New-NetFirewallRule -DisplayName $FirewallRule `
                  -Direction Outbound -Program $ChromeExe `
                  -RemoteAddress Internet -Action Block | Out-Null
              New-NetFirewallRule -DisplayName $ClaudeFirewallRule `
                  -Direction Outbound -Program $env:NPM_CLAUDE_NODE `
                  -RemoteAddress Internet -Action Block | Out-Null
              $RuntimeLockProcess = Start-Process -FilePath $env:ComSpec `
                  -ArgumentList @("/d", "/c", $RuntimeLockWrapper) `
                  -RedirectStandardOutput $RuntimeLockStdout `
                  -RedirectStandardError $RuntimeLockStderr `
                  -PassThru
              $LauncherProcess = Start-Process -FilePath $env:ComSpec `
                  -ArgumentList @("/d", "/c", $Wrapper) `
                  -RedirectStandardOutput $LauncherStdout `
                  -RedirectStandardError $LauncherStderr `
                  -PassThru
              $ManualMarker = "MANUAL EXTENSION LOAD REQUIRED:"
              $MarkerDeadline = [DateTime]::UtcNow.AddMinutes(5)
              $ManualFallbackReached = $false
              while (-not $LauncherProcess.HasExited -and
                  [DateTime]::UtcNow -lt $MarkerDeadline) {
                  $InstallLogs = @(Get-ChildItem -LiteralPath `
                      (Join-Path $env:TEMP "IntranetBrowserAgent") `
                      -Filter "INSTALL-WINDOWS-PILOT-*.log" `
                      -ErrorAction SilentlyContinue)
                  if ($InstallLogs | Where-Object {
                      Select-String -LiteralPath $_.FullName `
                          -SimpleMatch $ManualMarker -Quiet
                  }) {
                      $ManualFallbackReached = $true
                      break
                  }
                  Start-Sleep -Seconds 1
              }
              if (-not $ManualFallbackReached -and -not $LauncherProcess.HasExited) {
                  throw "The installer reached neither extension fallback nor completion."
              }
              if (-not $ManualFallbackReached) {
                  $LauncherExitCode = Read-CiExitCode `
                      $LauncherExitFile "One-click Windows launcher"
                  throw (
                      "The denied extension policy did not enter the supported " +
                      "manual fallback; launcher exit=$LauncherExitCode"
                  )
              }
              $FallbackInstallLog = Get-ChildItem -LiteralPath $InstallLogRoot `
                  -Filter "INSTALL-WINDOWS-PILOT-*.log" -ErrorAction Stop |
                  Sort-Object LastWriteTime -Descending |
                  Select-Object -First 1
              if (-not $FallbackInstallLog -or
                  -not (Select-String -LiteralPath $FallbackInstallLog.FullName `
                      -SimpleMatch "OFFLINE EXTENSION POLICY UNAVAILABLE" -Quiet)) {
                  throw "The installer did not classify denied policy access as optional."
              }
              Restore-CiExtensionPolicyAccess

              # The target flow leaves chrome://extensions open while the user
              # follows the three displayed steps. A GitHub-hosted runner cannot
              # provide trusted input to Chrome's native folder picker. Release
              # only this disposable Profile, then keep a session-only load of
              # the exact approved directory alive. This proves that the same
              # installer process notices the extension and continues, without
              # claiming that CI performed or persisted the human picker action.
              Stop-CiChrome
              foreach ($StaleMarker in @(
                  $ExtensionTokenFile, $CdpReadyFile, $CdpStopFile, $CdpExitFile
              )) {
                  Remove-Item -LiteralPath $StaleMarker -Force `
                      -ErrorAction SilentlyContinue
              }
              $CdpProcess = Start-Process -FilePath $env:ComSpec `
                  -ArgumentList @("/d", "/c", $CdpWrapper) `
                  -RedirectStandardOutput $CdpStdout `
                  -RedirectStandardError $CdpStderr `
                  -PassThru
              $CdpReadyDeadline = [DateTime]::UtcNow.AddSeconds(90)
              while (-not $CdpProcess.HasExited -and
                  -not (Test-Path -LiteralPath $CdpReadyFile -PathType Leaf) -and
                  [DateTime]::UtcNow -lt $CdpReadyDeadline) {
                  Start-Sleep -Milliseconds 250
              }
              if (-not (Test-Path -LiteralPath $CdpReadyFile -PathType Leaf)) {
                  $CdpExit = if ($CdpProcess.HasExited) {
                      if (Test-Path -LiteralPath $CdpExitFile -PathType Leaf) {
                          Read-CiExitCode $CdpExitFile "Chrome CI session"
                      } else {
                          "missing-marker"
                      }
                  } else {
                      "still-running"
                  }
                  throw "The Chrome CI session did not become ready; exit=$CdpExit"
              }
              $CdpReady = Get-Content -LiteralPath $CdpReadyFile -Raw |
                  ConvertFrom-Json
              if ($CdpReady.id -ne $Approval.extensionId -or
                  $CdpReady.version -ne $Approval.version -or
                  $CdpReady.enabled -ne $true) {
                  throw "The Chrome CI session reported an unexpected extension."
              }
              if ($CdpReady.sessionOnly -eq $true -and
                  [IO.Path]::GetFullPath([string]$CdpReady.path) -ine
                  [IO.Path]::GetFullPath($InstalledUnpacked)) {
                  throw "The session surrogate did not use the approved directory."
              }
              if ($ManualFallbackReached) {
                  if (-not $LauncherProcess.WaitForExit(300000)) {
                      throw "One-click Windows launcher did not continue after the extension appeared."
                  }
              }
              if (-not $LauncherProcess.HasExited) {
                  throw "One-click Windows launcher is still running unexpectedly."
              }
              $LauncherExitCode = Read-CiExitCode `
                  $LauncherExitFile "One-click Windows launcher"
              if ($LauncherExitCode -ne 0) {
                  throw "One-click Windows launcher failed with exit code $LauncherExitCode"
              }
              if (-not $RuntimeLockProcess.WaitForExit(30000)) {
                  throw "The runtime publish fault injector did not finish."
              }
              $RuntimeLockExitCode = Read-CiExitCode `
                  $RuntimeLockExitFile "Runtime publish fault injector"
              if ($RuntimeLockExitCode -ne 0) {
                  throw "The runtime publish fault injector failed with exit code $RuntimeLockExitCode."
              }
              $RuntimeLockFinished = $true
              if (-not (Test-Path -LiteralPath $RuntimeLockMarker -PathType Leaf)) {
                  throw "The runtime publish fault injector did not apply its access denial."
              }
              if (-not (Select-String -LiteralPath $RuntimeLockStdout `
                  -SimpleMatch "CI RUNTIME PUBLISH RETRY OBSERVED" -Quiet)) {
                  throw "The runtime publish fault injector did not observe the blocked move."
              }
              if (-not (Select-String -LiteralPath $RuntimeLockStdout `
                  -SimpleMatch "CI RUNTIME PUBLISH ACCESS DENIED RESTORED" -Quiet)) {
                  throw "The runtime publish fault injector did not restore the original ACL."
              }
              $CurrentInstallLog = Get-ChildItem -LiteralPath `
                  $InstallLogRoot `
                  -Filter "INSTALL-WINDOWS-PILOT-*.log" -ErrorAction Stop |
                  Sort-Object LastWriteTime -Descending |
                  Select-Object -First 1
              if (-not $CurrentInstallLog -or
                  -not (Select-String -LiteralPath $CurrentInstallLog.FullName `
                      -SimpleMatch "RUNTIME PUBLISH RETRY" -Quiet) -or
                  -not (Select-String -LiteralPath $CurrentInstallLog.FullName `
                      -SimpleMatch "RUNTIME PUBLISH RECOVERED" -Quiet)) {
                  throw "The installer did not prove runtime publish retry and recovery."
              }
              if (-not (Select-String -LiteralPath $CurrentInstallLog.FullName `
                  -SimpleMatch "EXTENSION INVALID DIRECTORY QUARANTINED" -Quiet)) {
                  throw "The installer did not quarantine the invalid extension leftover."
              }
              $QuarantinedExtensionMarkers = @(
                  Get-ChildItem -LiteralPath (Join-Path $env:LOCALAPPDATA `
                      "IntranetBrowserAgent\backups") `
                      -Filter $InvalidExtensionMarkerName -File -Recurse `
                      -ErrorAction Stop
              )
              if ($QuarantinedExtensionMarkers.Count -ne 1 -or
                  (Get-Content -LiteralPath `
                      $QuarantinedExtensionMarkers[0].FullName -Raw) -ne `
                      "preserve-and-rebuild") {
                  throw "The invalid extension leftover was not preserved exactly once."
              }
              if (Test-Path -LiteralPath (Join-Path $PreparedExtensionRoot `
                  $InvalidExtensionMarkerName)) {
                  throw "The rebuilt extension directory retained the invalid marker."
              }
              $InstalledManifestPath = Join-Path $env:LOCALAPPDATA `
                  "IntranetBrowserAgent\config\pilot\deployment.windows-pilot.json"
              $InstalledManifest = Get-Content -LiteralPath $InstalledManifestPath `
                  -Raw | ConvertFrom-Json
              $InstalledPlaywrightCli = Join-Path $InstalledManifest.installRoot `
                  "node_modules\@playwright\mcp\cli.js"
              $InstalledNode = [string]$InstalledManifest.nodeExecutable
              $InstalledPlaywrightConfig = Join-Path `
                  (Split-Path -Parent $InstalledManifestPath) `
                  "playwright.config.json"
              python $ExtensionExercise `
                  --node-executable $InstalledNode `
                  --playwright-cli $InstalledPlaywrightCli `
                  --playwright-config $InstalledPlaywrightConfig `
                  --environment-policy (Join-Path $env:TRANSFER_ROOT `
                      "toolkit\config\windows-mcp-environment.json") `
                  --token-file $ExtensionTokenFile `
                  --profile $ChromeUserData `
                  --browser-channel chrome `
                  --browser-executable $ChromeExe
              if ($LASTEXITCODE -ne 0) {
                  throw "Installed Playwright MCP could not reuse the offline Chrome session."
              }
              [IO.File]::WriteAllText(
                  $CdpStopFile,
                  "stop",
                  (New-Object System.Text.ASCIIEncoding)
              )
              if (-not $CdpProcess.WaitForExit(30000)) {
                  throw "The Chrome CI session did not stop after the E2E completed."
              }
              $CdpExitCode = Read-CiExitCode $CdpExitFile "Chrome CI session"
              if ($CdpExitCode -ne 0) {
                  throw "The Chrome CI session failed with exit code $CdpExitCode"
              }
              $CdpFinished = $true
              $LauncherFinished = $true
          } finally {
              if ($RuntimeLockProcess -and -not $RuntimeLockFinished -and
                  -not $RuntimeLockProcess.HasExited) {
                  Stop-Process -Id $RuntimeLockProcess.Id -Force `
                      -ErrorAction SilentlyContinue
                  $null = $RuntimeLockProcess.WaitForExit(5000)
              }
              if ($LauncherProcess -and -not $LauncherFinished -and
                  -not $LauncherProcess.HasExited) {
                  # The launcher is cmd -> one installer process. Kill the
                  # disposable CI process tree so a failed browser probe cannot
                  # leave the installer waiting and keep redirected handles open.
                  & (Join-Path $env:SystemRoot "System32\taskkill.exe") `
                      /PID $LauncherProcess.Id /T /F 2>$null | Out-Null
                  if (-not $LauncherProcess.HasExited) {
                      Stop-Process -Id $LauncherProcess.Id -Force `
                          -ErrorAction SilentlyContinue
                  }
                  $null = $LauncherProcess.WaitForExit(5000)
              }
              if ($CdpProcess -and -not $CdpFinished -and
                  -not $CdpProcess.HasExited) {
                  if (-not (Test-Path -LiteralPath $CdpStopFile -PathType Leaf)) {
                      [IO.File]::WriteAllText(
                          $CdpStopFile,
                          "stop",
                          (New-Object System.Text.ASCIIEncoding)
                      )
                  }
                  if (-not $CdpProcess.WaitForExit(15000)) {
                      & (Join-Path $env:SystemRoot "System32\taskkill.exe") `
                          /PID $CdpProcess.Id /T /F 2>$null | Out-Null
                      $null = $CdpProcess.WaitForExit(5000)
                  }
              }
              @(Get-Process -Name chrome -ErrorAction SilentlyContinue) |
                  Stop-Process -Force -ErrorAction SilentlyContinue
              Remove-NetFirewallRule -DisplayName $FirewallRule `
                  -ErrorAction SilentlyContinue
              Remove-NetFirewallRule -DisplayName $ClaudeFirewallRule `
                  -ErrorAction SilentlyContinue
              foreach ($Marker in @(
                  $ExtensionTokenFile, $CdpReadyFile, $CdpStopFile,
                  $LauncherExitFile, $CdpExitFile
              )) {
                  Remove-Item -LiteralPath $Marker -Force `
                      -ErrorAction SilentlyContinue
              }
              if (Test-Path -LiteralPath $CdpStdout) {
                  Get-Content -LiteralPath $CdpStdout -ErrorAction SilentlyContinue |
                      Write-Host
              }
              if (Test-Path -LiteralPath $CdpStderr) {
                  Get-Content -LiteralPath $CdpStderr -ErrorAction SilentlyContinue |
                      Write-Host
              }
              if (Test-Path -LiteralPath $LauncherStdout) {
                  Get-Content -LiteralPath $LauncherStdout -ErrorAction SilentlyContinue |
                      Write-Host
              }
              if (Test-Path -LiteralPath $LauncherStderr) {
                  Get-Content -LiteralPath $LauncherStderr -ErrorAction SilentlyContinue |
                      Write-Host
              }
              if (Test-Path -LiteralPath $RuntimeLockStdout) {
                  Get-Content -LiteralPath $RuntimeLockStdout `
                      -ErrorAction SilentlyContinue | Write-Host
              }
              if (Test-Path -LiteralPath $RuntimeLockStderr) {
                  Get-Content -LiteralPath $RuntimeLockStderr `
                      -ErrorAction SilentlyContinue | Write-Host
              }
              Restore-CiExtensionPolicyAccess
          }

      - name: Verify publisher-gate and installed-state evidence
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $ChromeExe = [string]$env:CHROME_EXE
          if (-not $ChromeExe -or
              -not (Test-Path -LiteralPath $ChromeExe -PathType Leaf)) {
              throw "The detected Chrome executable was not preserved between steps."
          }
          $EvidenceRoot = Join-Path $env:RUNNER_TEMP "windows-evidence"
          New-Item -ItemType Directory -Path $EvidenceRoot -Force | Out-Null
          $PublisherGateLog = [string]$env:PUBLISHER_GATE_LOG
          if (-not $PublisherGateLog -or
              -not (Test-Path -LiteralPath $PublisherGateLog -PathType Leaf)) {
              throw "The publisher release-gate log is missing."
          }
          $LogRoot = Join-Path $env:TEMP "IntranetBrowserAgent"
          $InstallLogs = @(Get-ChildItem -LiteralPath $LogRoot `
              -Filter "INSTALL-WINDOWS-PILOT-*.log" -ErrorAction Stop |
              Sort-Object LastWriteTime -Descending)
          if ($InstallLogs.Count -lt 1) {
              throw "The launcher did not preserve its installer log."
          }
          if (-not (Select-String -LiteralPath $PublisherGateLog `
              -SimpleMatch "WINDOWS POWERSHELL 5.1 RELEASE GATE PASSED" -Quiet)) {
              throw "The publisher release-gate PASS marker is missing."
          }
          if (-not (Select-String -LiteralPath $PublisherGateLog `
              -SimpleMatch "CLAUDE MCP REGISTRATION SELF-TEST PASSED" -Quiet)) {
              throw "The publisher release gate did not run the registration self-test."
          }
          if (-not (Select-String -LiteralPath $PublisherGateLog `
              -SimpleMatch "test_self_test_runs_as_a_real_subprocess" -Quiet)) {
              throw "The publisher release gate did not run the complete Python suite."
          }
          if (-not (Select-String -LiteralPath $InstallLogs[0].FullName `
              -SimpleMatch "SUCCESS: installation and preflight completed" -Quiet)) {
              throw "The installer success marker is missing."
          }
          if (Select-String -LiteralPath $InstallLogs[0].FullName `
              -SimpleMatch "CLAUDE MCP REGISTRATION SELF-TEST" -Quiet) {
              throw "The target installer unexpectedly ran the publisher-only self-test."
          }
          if (Select-String -LiteralPath $InstallLogs[0].FullName `
              -SimpleMatch "test_self_test_runs_as_a_real_subprocess" -Quiet) {
              throw "The target installer unexpectedly ran the publisher-only unit suite."
          }
          if (-not (Select-String -LiteralPath $InstallLogs[0].FullName `
              -SimpleMatch "RUNTIME PUBLISH RETRY" -Quiet) -or
              -not (Select-String -LiteralPath $InstallLogs[0].FullName `
              -SimpleMatch "RUNTIME PUBLISH RECOVERED" -Quiet)) {
              throw "Runtime publish retry/recovery evidence is missing."
          }
          if (-not (Select-String -LiteralPath $InstallLogs[0].FullName `
              -SimpleMatch "OFFLINE EXTENSION POLICY UNAVAILABLE" -Quiet) -or
              -not (Select-String -LiteralPath $InstallLogs[0].FullName `
              -SimpleMatch "MANUAL EXTENSION LOAD REQUIRED" -Quiet)) {
              throw "Denied extension-policy fallback evidence is missing."
          }
          if (-not (Select-String -LiteralPath $InstallLogs[0].FullName `
              -SimpleMatch "EXTENSION INVALID DIRECTORY QUARANTINED" -Quiet)) {
              throw "Invalid extension recovery evidence is missing."
          }
          $InstallerStarts = @(Select-String -LiteralPath `
              $InstallLogs[0].FullName `
              -SimpleMatch "Windows pilot installer started")
          if ($InstallerStarts.Count -ne 1) {
              throw "The one-click flow did not use exactly one installer process."
          }
          $Summary = Join-Path $env:LOCALAPPDATA "IntranetBrowserAgent\INSTALLATION.txt"
          $ManifestPath = Join-Path $env:LOCALAPPDATA `
              "IntranetBrowserAgent\config\pilot\deployment.windows-pilot.json"
          $UserConfig = Join-Path $env:CLAUDE_CONFIG_DIR ".claude.json"
          foreach ($Required in @($Summary, $ManifestPath, $UserConfig)) {
              if (-not (Test-Path -LiteralPath $Required -PathType Leaf)) {
                  throw "Expected installed-state evidence is missing: $Required"
              }
          }
          $SummaryText = Get-Content -LiteralPath $Summary -Raw
          $Manifest = Get-Content -LiteralPath $ManifestPath -Raw | ConvertFrom-Json
          if ($Manifest.mcpScope -ne "user" -or @($Manifest.workspaceRoots).Count -ne 0) {
              throw "Installed manifest is not project-independent user scope."
          }
          if ($null -ne $Manifest.network) {
              throw "Windows pilot unexpectedly contains an origin allowlist."
          }
          if ($Manifest.mode -ne "extension" -or
              $null -ne $Manifest.browser.userDataDir -or
              $Manifest.browser.manualConnectionApproval -ne $true) {
              throw "Windows pilot is not bound to approved existing-tab extension mode."
          }
          if ([IO.Path]::GetFullPath([string]$Manifest.browser.executablePath) -ine
              [IO.Path]::GetFullPath($ChromeExe)) {
              throw "Windows pilot is not bound to the detected Chrome executable."
          }
          $ExtensionId = "mmlmfjhmonkocbjadbfplnigmagldckm"
          $ExtensionApproval = Get-Content -LiteralPath (Join-Path `
              $env:TRANSFER_ROOT "toolkit\config\playwright-extension-source.json") `
              -Raw | ConvertFrom-Json
          $ExtensionVersion = [string]$ExtensionApproval.version
          $ApprovedUnpacked = Join-Path $env:LOCALAPPDATA `
              "IntranetBrowserAgent\browser-extension\$ExtensionVersion\unpacked"
          python (Join-Path $env:TRANSFER_ROOT `
              "toolkit\scripts\check_playwright_extension.py") check `
              --local-app-data $env:LOCALAPPDATA `
              --browser-channel chrome `
              --expected-version $ExtensionVersion `
              --approved-unpacked-path $ApprovedUnpacked
          if ($LASTEXITCODE -ne 0) {
              throw "The packaged extension was not installed into Chrome."
          }
          $PlaywrightConfig = Join-Path (Split-Path -Parent $ManifestPath) `
              "playwright.config.json"
          $Rendered = Get-Content -LiteralPath $PlaywrightConfig -Raw | ConvertFrom-Json
          if ($Rendered.extension -ne $true -or $null -ne $Rendered.browser) {
              throw "Rendered Playwright config does not use extension mode."
          }
          $ClaudePayload = Get-Content -LiteralPath $UserConfig -Raw | ConvertFrom-Json
          $RegisteredArgs = @(
              $ClaudePayload.mcpServers.'intranet-browser-agent'.args
          )
          if ($RegisteredArgs -notcontains "--browser=chrome") {
              throw "Registered MCP does not bind the selected Chrome channel."
          }
          if ($RegisteredArgs -notcontains ("--executable-path=" + $ChromeExe)) {
              throw "Registered MCP does not bind the detected Chrome executable."
          }
          $PolicyPath = "HKCU:\Software\Policies\Google\Chrome\ExtensionInstallForcelist"
          $PolicyValues = @()
          if (Test-Path -LiteralPath $PolicyPath) {
              $PolicyKey = Get-Item -LiteralPath $PolicyPath
              $PolicyValues = @($PolicyKey.GetValueNames() | ForEach-Object {
                  [string]$PolicyKey.GetValue($_, "")
              })
          }
          if ($SummaryText -match "Extension install method: offline-user-policy") {
              if (-not ($PolicyValues | Where-Object {
                  $_ -match ("^" + $ExtensionId + ";file:///")
              })) {
                  throw "Offline local-file extension policy evidence is missing."
              }
          } elseif ($SummaryText -match "Extension install method: manual-unpacked") {
              if ($PolicyValues | Where-Object {
                  $_ -match ("^" + $ExtensionId + ";")
              }) {
                  throw "Manual fallback left the temporary extension policy behind."
              }
          } elseif ($SummaryText -notmatch "Extension install method: existing") {
              throw "The installer did not record a valid extension installation method."
          }
          python (Join-Path $env:TRANSFER_ROOT "toolkit\scripts\verify-bundle.py") `
              $Manifest.installRoot
          if ($LASTEXITCODE -ne 0) {
              throw "Installed runtime verification failed."
          }
          Copy-Item -LiteralPath $PublisherGateLog `
              -Destination (Join-Path $EvidenceRoot `
                  "WINDOWS-PUBLISHER-RELEASE-GATE.log")
          Copy-Item -LiteralPath $InstallLogs[0].FullName `
              -Destination (Join-Path $EvidenceRoot "INSTALL-WINDOWS-PILOT.log")
          Copy-Item -LiteralPath $Summary `
              -Destination (Join-Path $EvidenceRoot "INSTALLATION.txt")
          Copy-Item -LiteralPath $ManifestPath `
              -Destination (Join-Path $EvidenceRoot "deployment.windows-pilot.json")
          Copy-Item -LiteralPath "$env:TRANSFER_ARCHIVE.sha256" `
              -Destination (Join-Path $EvidenceRoot "transfer.tar.gz.sha256")
          Write-Host "Windows publisher gate and single-pass one-click install both passed."

      - name: Upload Windows validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-validation-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}\windows-evidence
          if-no-files-found: warn
          retention-days: 30

      - name: Upload the gate-passed Windows transfer kit
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: intranet-browser-agent-transfer-1.0.13-windows-x64-${{ github.run_id }}
          path: |
            ${{ env.TRANSFER_ARCHIVE }}
            ${{ env.TRANSFER_ARCHIVE }}.sha256
          if-no-files-found: error
          retention-days: 30
